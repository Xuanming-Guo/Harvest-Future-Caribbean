openapi: 3.1.0
info:
  title: Harvest Product API
  version: 0.8.0
  description: >-
    Canonical operational API for real users, Harvest-mode simulated actors,
    the participant website, and the simulation control room. Operational
    state and its outbox event are committed atomically by this service.
servers:
  - url: http://localhost:3001
    description: Local Fastify service
tags:
  - name: Crop
    description: Crop observations, batches, and forecast requests.
  - name: Marketplace
    description: Safely orderable supply and buyer demand.
  - name: Orders
    description: Orders, allocations, and human approvals.
  - name: Delivery
    description: Missions, tracking, exceptions, and delivery outcomes.
  - name: Operations
    description: Role-filtered projections, event stream, and safe traces.
  - name: Simulation
    description: Public control-room gateway to observable simulation state.
security:
  - bearerJwt: []
paths:
  /v1/me:
    get:
      tags: [Operations]
      operationId: getCurrentActor
      summary: Read the authenticated participant and replay mode
      responses:
        '200':
          description: Current role, run scope, and whether this session is read-only.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CurrentActor'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/crop-observation-intakes:
    post:
      tags: [Crop]
      operationId: createCropObservationIntake
      summary: Extract a non-binding crop observation draft for human review
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CropObservationIntakeCreate'}
            example:
              cropBatchId: 11111111-1111-4111-8111-111111111111
              observedAt: '2026-09-04T08:00:00Z'
              sourceType: TEXT
              sourceText: Approximately 20 kg of cucumbers, with some rain damage.
              provenance: OBSERVED
      responses:
        '201':
          description: Editable draft created; no crop state or inventory changed.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CropObservationIntake'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/crop-observations:
    post:
      tags: [Crop]
      operationId: createCropObservation
      summary: Submit an observable crop update
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CropObservationCreate'
            example:
              cropBatchId: 11111111-1111-4111-8111-111111111111
              observedAt: '2026-08-01T09:30:00Z'
              cropStage: FRUITING
              notes: Fruit size is increasing after rain.
              estimatedQuantity: {value: 520, unit: kg}
              provenance: OBSERVED
      responses:
        '201':
          description: Observation stored and `CROP_OBSERVATION_SUBMITTED` emitted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CropObservation'}
              example:
                observationId: 12121212-1212-4212-8212-121212121212
                cropBatchId: 11111111-1111-4111-8111-111111111111
                observedAt: '2026-08-01T09:30:00Z'
                recordedAt: '2026-08-01T09:30:02Z'
                cropStage: FRUITING
                notes: Fruit size is increasing after rain.
                estimatedQuantity: {value: 520, unit: kg}
                provenance: OBSERVED
                traceId: 13131313-1313-4313-8313-131313131313
        default: {$ref: '#/components/responses/Problem'}
  /v1/crop-batches:
    get:
      tags: [Crop]
      operationId: listCropBatches
      summary: List observable crop supply visible to the caller
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - name: cropType
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {enum: [PLANNED, GROWING, HARVEST_READY, HARVESTED, CLOSED]}
      responses:
        '200':
          description: Role-filtered crop batches.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CropBatchPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/crop-batches/{cropBatchId}:
    get:
      tags: [Crop]
      operationId: getCropBatch
      summary: Read an observable crop batch and its latest safe forecast
      parameters:
        - $ref: '#/components/parameters/CropBatchId'
      responses:
        '200':
          description: Crop batch visible to the caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CropBatch'}
              example:
                cropBatchId: 11111111-1111-4111-8111-111111111111
                farmId: 14141414-1414-4414-8414-141414141414
                cropType: TOMATO
                status: GROWING
                latestObservationId: 12121212-1212-4212-8212-121212121212
                availableToPromise: {value: 380, unit: kg}
                provenance: MODEL_PREDICTED
        default: {$ref: '#/components/responses/Problem'}
  /v1/crop-standards:
    get:
      tags: [Crop]
      operationId: listCropStandards
      summary: List published crop standards and the caller's own drafts
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - name: cropType
          in: query
          required: true
          schema: {type: string, minLength: 1}
      responses:
        '200':
          description: Versioned crop standards for the requested crop.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CropStandardPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Crop]
      operationId: createCropStandard
      summary: Create a new publisher-specific crop standard version
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CropStandardCreate'}
      responses:
        '201':
          description: A new immutable standard version was created.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CropStandard'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/crop-batches/{cropBatchId}/forecast-requests:
    post:
      tags: [Crop]
      operationId: requestCropForecast
      summary: Request asynchronous yield inference for a crop batch
      parameters:
        - $ref: '#/components/parameters/CropBatchId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ForecastRequest'}
            example:
              reason: NEW_OBSERVATION
      responses:
        '202':
          description: Forecast request accepted; a validated result later emits `FORECAST_PRODUCED`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ForecastJob'}
              example:
                forecastRequestId: 15151515-1515-4515-8515-151515151515
                cropBatchId: 11111111-1111-4111-8111-111111111111
                status: QUEUED
                requestedAt: '2026-08-01T09:31:00Z'
        default: {$ref: '#/components/responses/Problem'}
  /v1/yield-predictions/{predictionId}:
    get:
      tags: [Crop]
      operationId: getYieldPrediction
      summary: Read a validated prediction and its safe evidence snapshot
      parameters:
        - $ref: '#/components/parameters/PredictionId'
      responses:
        '200':
          description: A role-filtered Product API projection, never a direct model-service response.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/YieldPredictionEvidence'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/listings:
    get:
      tags: [Marketplace]
      operationId: listListings
      summary: Browse safely orderable crop supply
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - name: cropType
          in: query
          schema: {type: string}
      responses:
        '200':
          description: A cursor page of active listings.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListingPage'}
              example:
                items:
                  - listingId: 16161616-1616-4616-8616-161616161616
                    cropBatchId: 11111111-1111-4111-8111-111111111111
                    farmerId: 17171717-1717-4717-8717-171717171717
                    cropType: TOMATO
                    quantity: {value: 200, unit: kg}
                    unitPrice: {amount: 7.5, currency: XCD}
                    availableFrom: '2026-08-10'
                    availableUntil: '2026-08-17'
                    status: ACTIVE
                    createdAt: '2026-08-01T10:00:00Z'
                pageInfo: {hasNextPage: false}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Marketplace]
      operationId: createListing
      summary: Publish supply bounded by available-to-promise
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ListingCreate'}
            example:
              cropBatchId: 11111111-1111-4111-8111-111111111111
              quantity: {value: 200, unit: kg}
              unitPrice: {amount: 7.5, currency: XCD}
              availableFrom: '2026-08-10'
              availableUntil: '2026-08-17'
      responses:
        '201':
          description: Listing stored and `LISTING_PUBLISHED` emitted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Listing'}
              example:
                listingId: 16161616-1616-4616-8616-161616161616
                cropBatchId: 11111111-1111-4111-8111-111111111111
                farmerId: 17171717-1717-4717-8717-171717171717
                cropType: TOMATO
                quantity: {value: 200, unit: kg}
                unitPrice: {amount: 7.5, currency: XCD}
                availableFrom: '2026-08-10'
                availableUntil: '2026-08-17'
                status: ACTIVE
                createdAt: '2026-08-01T10:00:00Z'
        default: {$ref: '#/components/responses/Problem'}
  /v1/listings/{listingId}:
    get:
      tags: [Marketplace]
      operationId: getListing
      summary: Read privacy-safe production evidence for one listing
      parameters:
        - $ref: '#/components/parameters/ListingId'
      responses:
        '200':
          description: Listing detail with a general production zone and current supply evidence.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ListingDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/market-opportunities:
    get:
      tags: [Marketplace]
      operationId: listMarketOpportunities
      summary: Browse privacy-safe open demand relevant to visible crops
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - name: cropType
          in: query
          schema: {type: string}
      responses:
        '200':
          description: Open buyer demand without buyer identity or exact delivery coordinates.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MarketOpportunityPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/buyer-demands:
    get:
      tags: [Marketplace]
      operationId: listBuyerDemands
      summary: List role-filtered buyer demand
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - name: cropType
          in: query
          schema: {type: string}
        - name: status
          in: query
          schema: {enum: [OPEN, MATCHING, SATISFIED, CANCELLED]}
      responses:
        '200':
          description: Buyer demands visible to the caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BuyerDemandPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Marketplace]
      operationId: createBuyerDemand
      summary: Record demand that matching workflows may fulfil
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/BuyerDemandCreate'}
            example:
              cropType: TOMATO
              quantity: {value: 120, unit: kg}
              neededBy: '2026-08-12T14:00:00Z'
              deliveryLocation: {latitude: 13.9094, longitude: -60.9789}
              maxUnitPrice: {amount: 8, currency: XCD}
      responses:
        '201':
          description: Demand stored and `BUYER_DEMAND_CREATED` emitted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/BuyerDemand'}
              example:
                demandId: 18181818-1818-4818-8818-181818181818
                buyerId: 19191919-1919-4919-8919-191919191919
                cropType: TOMATO
                quantity: {value: 120, unit: kg}
                neededBy: '2026-08-12T14:00:00Z'
                deliveryLocation: {latitude: 13.9094, longitude: -60.9789}
                maxUnitPrice: {amount: 8, currency: XCD}
                status: OPEN
                createdAt: '2026-08-01T10:10:00Z'
        default: {$ref: '#/components/responses/Problem'}
  /v1/orders:
    get:
      tags: [Orders]
      operationId: listOrders
      summary: List role-filtered orders and risk overlays
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/OrderStatus'}
        - name: atRisk
          in: query
          schema: {type: boolean}
        - name: cropBatchId
          in: query
          description: Return only orders whose latest allocation commits this crop batch.
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Orders visible to the caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Orders]
      operationId: createOrder
      summary: Create an order and begin matching
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/OrderCreate'}
            example:
              cropType: TOMATO
              requestedQuantity: {value: 120, unit: kg}
              neededBy: '2026-08-12T14:00:00Z'
              deliveryLocation: {latitude: 13.9094, longitude: -60.9789}
              minimumAcceptableFraction: 0.8
              listingIds: [16161616-1616-4616-8616-161616161616]
      responses:
        '201':
          description: Order stored in `REQUESTED` and `ORDER_REQUESTED` emitted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Order'}
              example:
                orderId: 20202020-2020-4020-8020-202020202020
                buyerId: 19191919-1919-4919-8919-191919191919
                cropType: TOMATO
                requestedQuantity: {value: 120, unit: kg}
                committedQuantity: {value: 0, unit: kg}
                acceptedQuantity: {value: 0, unit: kg}
                minimumAcceptableFraction: 0.8
                neededBy: '2026-08-12T14:00:00Z'
                lifecycleStatus: REQUESTED
                atRisk: false
                createdAt: '2026-08-01T10:15:00Z'
                updatedAt: '2026-08-01T10:15:00Z'
        default: {$ref: '#/components/responses/Problem'}
  /v1/orders/{orderId}:
    get:
      tags: [Orders]
      operationId: getOrder
      summary: Read current order lifecycle and risk overlay
      parameters:
        - $ref: '#/components/parameters/OrderId'
      responses:
        '200':
          description: Order visible to the caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OrderDetail'}
              example:
                orderId: 20202020-2020-4020-8020-202020202020
                buyerId: 19191919-1919-4919-8919-191919191919
                cropType: TOMATO
                requestedQuantity: {value: 120, unit: kg}
                committedQuantity: {value: 120, unit: kg}
                acceptedQuantity: {value: 120, unit: kg}
                minimumAcceptableFraction: 0.8
                neededBy: '2026-08-12T14:00:00Z'
                lifecycleStatus: FULFILLED
                atRisk: false
                approvalSummary: {required: 3, approved: 3, pending: 0, rejected: 0}
                createdAt: '2026-08-01T10:15:00Z'
                updatedAt: '2026-08-12T13:45:00Z'
        default: {$ref: '#/components/responses/Problem'}
  /v1/approvals:
    get:
      tags: [Orders]
      operationId: listApprovals
      summary: List pending and decided human approvals
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - name: status
          in: query
          schema: {enum: [PENDING, APPROVED, REJECTED, CANCELLED]}
        - name: subjectType
          in: query
          schema: {enum: [ALLOCATION, RECOVERY, CANCELLATION, SUBSTITUTION, PRICE_CHANGE, LOCATION_DISCLOSURE, PRODUCE_REJECTION, INTER_ISLAND_COMMITMENT]}
      responses:
        '200':
          description: Approval requests visible to the caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApprovalPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/approvals/{approvalId}/decisions:
    post:
      tags: [Orders]
      operationId: decideApproval
      summary: Approve or reject a pending human decision
      parameters:
        - $ref: '#/components/parameters/ApprovalId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ApprovalDecision'}
            example:
              decision: APPROVE
              reason: Quantity and collection window confirmed.
      responses:
        '200':
          description: >-
            Decision recorded; approved allocation/recovery emits its
            corresponding event. `REJECT` without `reasonCode` and `nextAction`
            fails with `422 DECISION_REASON_REQUIRED`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Approval'}
              example:
                approvalId: 21212121-2121-4121-8121-212121212121
                subjectType: ALLOCATION
                subjectId: 22222222-2222-4222-8222-222222222222
                status: APPROVED
                requestedAt: '2026-08-01T10:55:00Z'
                decidedBy: 17171717-1717-4717-8717-171717171717
                decidedAt: '2026-08-01T11:00:00Z'
        default: {$ref: '#/components/responses/Problem'}
  /v1/delivery-missions:
    get:
      tags: [Delivery]
      operationId: listDeliveryMissions
      summary: List available or assigned missions for the caller
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/MissionStatus'}
      responses:
        '200':
          description: Cursor page of visible missions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/MissionPage'}
              example:
                items:
                  - missionId: 23232323-2323-4323-8323-232323232323
                    orderId: 20202020-2020-4020-8020-202020202020
                    status: AVAILABLE
                    currentStopSequence: 0
                    quantity: {value: 120, unit: kg}
                    deadline: '2026-08-12T14:00:00Z'
                    stops:
                      - {sequence: 1, kind: PICKUP, location: {latitude: 13.94, longitude: -60.96}}
                      - {sequence: 2, kind: DROPOFF, location: {latitude: 13.9094, longitude: -60.9789}}
                pageInfo: {hasNextPage: false}
        default: {$ref: '#/components/responses/Problem'}
  /v1/delivery-missions/{missionId}:
    get:
      tags: [Delivery]
      operationId: getDeliveryMission
      summary: Read mission route, quantities, assignment, and deadline
      parameters:
        - $ref: '#/components/parameters/MissionId'
      responses:
        '200':
          description: Mission visible to the caller.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryMission'}
              example:
                missionId: 23232323-2323-4323-8323-232323232323
                orderId: 20202020-2020-4020-8020-202020202020
                status: ASSIGNED
                currentStopSequence: 0
                transporterId: 24242424-2424-4424-8424-242424242424
                quantity: {value: 120, unit: kg}
                deadline: '2026-08-12T14:00:00Z'
                stops:
                  - {sequence: 1, kind: PICKUP, location: {latitude: 13.94, longitude: -60.96}}
                  - {sequence: 2, kind: DROPOFF, location: {latitude: 13.9094, longitude: -60.9789}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/delivery-missions/{missionId}/acceptance:
    post:
      tags: [Delivery]
      operationId: acceptDeliveryMission
      summary: Accept an available delivery mission
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/MissionAcceptance'}
            example:
              decision: ACCEPT
              vehicleId: 25252525-2525-4525-8525-252525252525
      responses:
        '200':
          description: Transporter assigned and `DELIVERY_MISSION_ACCEPTED` emitted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryMission'}
              example:
                missionId: 23232323-2323-4323-8323-232323232323
                orderId: 20202020-2020-4020-8020-202020202020
                status: ASSIGNED
                currentStopSequence: 0
                transporterId: 24242424-2424-4424-8424-242424242424
                vehicleId: 25252525-2525-4525-8525-252525252525
                quantity: {value: 120, unit: kg}
                deadline: '2026-08-12T14:00:00Z'
                stops:
                  - {sequence: 1, kind: PICKUP, location: {latitude: 13.94, longitude: -60.96}}
                  - {sequence: 2, kind: DROPOFF, location: {latitude: 13.9094, longitude: -60.9789}}
        default: {$ref: '#/components/responses/Problem'}
  /v1/delivery-missions/{missionId}/updates:
    get:
      tags: [Delivery]
      operationId: listDeliveryUpdates
      summary: Read chronological observable updates for a visible mission
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Chronological mission update history.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryUpdatePage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Delivery]
      operationId: postDeliveryUpdate
      summary: Record observable mission progress
      parameters:
        - $ref: '#/components/parameters/MissionId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeliveryUpdateCreate'}
            example:
              updateType: POSITION
              recordedAt: '2026-08-12T12:30:00Z'
              position: {latitude: 13.925, longitude: -60.97}
              note: En route to buyer.
      responses:
        '201':
          description: Update stored and `DELIVERY_UPDATE_POSTED` emitted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryUpdate'}
              example:
                updateId: 26262626-2626-4626-8626-262626262626
                missionId: 23232323-2323-4323-8323-232323232323
                updateType: POSITION
                recordedAt: '2026-08-12T12:30:00Z'
                position: {latitude: 13.925, longitude: -60.97}
                note: En route to buyer.
        default: {$ref: '#/components/responses/Problem'}
  /v1/me/vehicles:
    get:
      tags: [Delivery]
      operationId: listMyVehicles
      summary: List vehicles owned by the signed-in transporter
      responses:
        '200':
          description: Transporter-owned vehicles available for mission assignment.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VehiclePage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/verification-tasks:
    get:
      tags: [Operations]
      operationId: listVerificationTasks
      summary: List crop verification work for permitted farms
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - name: status
          in: query
          schema: {$ref: '#/components/schemas/VerificationStatus'}
      responses:
        '200':
          description: Verification tasks limited to the coordinator's permitted farms.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VerificationTaskPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/verification-tasks/{taskId}/decisions:
    post:
      tags: [Operations]
      operationId: decideVerificationTask
      summary: Verify an observation or request changes
      parameters:
        - $ref: '#/components/parameters/VerificationTaskId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/VerificationDecision'}
      responses:
        '200':
          description: >-
            Final verification decision recorded. `REQUEST_CHANGES` without
            `reasonCode` and `nextAction` fails with
            `422 DECISION_REASON_REQUIRED`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/VerificationTask'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/exceptions:
    get:
      tags: [Delivery]
      operationId: listExceptions
      summary: List operational exceptions visible to the caller
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
        - {$ref: '#/components/parameters/Limit'}
        - name: status
          in: query
          schema: {enum: [OPEN, RECOVERY_PENDING, RESOLVED]}
        - name: severity
          in: query
          schema: {enum: [LOW, MEDIUM, HIGH, CRITICAL]}
      responses:
        '200':
          description: Role-filtered operational exceptions.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExceptionPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Delivery]
      operationId: createException
      summary: Report an observable operational exception
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ExceptionCreate'}
            example:
              exceptionType: DELAY
              severity: HIGH
              affectedEntityIds: [20202020-2020-4020-8020-202020202020]
              description: Road closure is delaying the active route.
              provenance: OBSERVED
      responses:
        '201':
          description: Exception stored, order risk overlay set, and `EXCEPTION_REPORTED` emitted.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationalException'}
              example:
                exceptionId: 27272727-2727-4727-8727-272727272727
                exceptionType: DELAY
                severity: HIGH
                affectedEntityIds: [20202020-2020-4020-8020-202020202020]
                description: Road closure is delaying the active route.
                status: OPEN
                provenance: OBSERVED
                reportedAt: '2026-08-12T12:35:00Z'
        default: {$ref: '#/components/responses/Problem'}
  /v1/exceptions/{exceptionId}:
    get:
      tags: [Delivery]
      operationId: getException
      summary: Read a visible exception and its concrete recovery proposal
      parameters:
        - $ref: '#/components/parameters/ExceptionId'
      responses:
        '200':
          description: Exception detail including any stored recovery proposal.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ExceptionDetail'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/deliveries/{deliveryId}/acceptance:
    post:
      tags: [Delivery]
      operationId: acceptDelivery
      summary: Record buyer acceptance and final quantities
      parameters:
        - $ref: '#/components/parameters/DeliveryId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/DeliveryAcceptanceCreate'}
            example:
              outcome: ACCEPTED
              acceptedQuantity: {value: 120, unit: kg}
              rejectedQuantity: {value: 0, unit: kg}
              lineOutcomes:
                - cropBatchId: 11111111-1111-4111-8111-111111111111
                  acceptedQuantity: {value: 120, unit: kg}
                  rejectedQuantity: {value: 0, unit: kg}
              note: Produce received in good condition.
      responses:
        '201':
          description: >-
            Outcome stored; delivery/order outcome events emitted atomically.
            Any rejected quantity without `reasonCode` and `nextAction` fails
            with `422 DECISION_REASON_REQUIRED`.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DeliveryAcceptance'}
              example:
                deliveryId: 28282828-2828-4828-8828-282828282828
                orderId: 20202020-2020-4020-8020-202020202020
                outcome: ACCEPTED
                acceptedQuantity: {value: 120, unit: kg}
                rejectedQuantity: {value: 0, unit: kg}
                lineOutcomes:
                  - cropBatchId: 11111111-1111-4111-8111-111111111111
                    acceptedQuantity: {value: 120, unit: kg}
                    rejectedQuantity: {value: 0, unit: kg}
                acceptedBy: 19191919-1919-4919-8919-191919191919
                acceptedAt: '2026-08-12T13:45:00Z'
        default: {$ref: '#/components/responses/Problem'}
  /v1/operations/snapshot:
    get:
      tags: [Operations]
      operationId: getOperationsSnapshot
      summary: Read the role-filtered operational projection
      parameters:
        - name: simulationRunId
          in: query
          schema: {type: string, format: uuid}
      responses:
        '200':
          description: Current observable operational totals.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/OperationsSnapshot'}
              example:
                generatedAt: '2026-08-12T13:46:00Z'
                simulationRunId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                activeListings: 4
                openDemands: 2
                ordersByStatus: {REQUESTED: 1, COMMITTED: 2, IN_DELIVERY: 1, FULFILLED: 8}
                orderOutcomes: {total: 12, fulfilled: 8, partiallyFulfilled: 0, unfulfilled: 1, pending: 3, causes: {INSUFFICIENT_SUPPLY: 1}}
                deliveryAcceptedKg: 840
                approvedCommitmentCount: 9
                completedMissionCount: 8
                activeMissionIds: [23232323-2323-4323-8323-232323232323]
                openExceptionIds: []
        default: {$ref: '#/components/responses/Problem'}
  /v1/agent-traces/{traceId}:
    get:
      tags: [Operations]
      operationId: getAgentTrace
      summary: Read a safe decision trace without private chain-of-thought
      parameters:
        - $ref: '#/components/parameters/TraceId'
      responses:
        '200':
          description: Concise trace summary, evidence, tool calls, approvals, and outcomes.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AgentTrace'}
              example:
                traceId: 13131313-1313-4313-8313-131313131313
                subjectType: ORDER
                subjectId: 20202020-2020-4020-8020-202020202020
                workflowType: ORDER_FULFILMENT
                stage: DELIVERY_OUTCOME_RECORDED
                status: COMPLETED
                summary: Proposed a two-farm allocation within safe quantities.
                createdAt: '2026-08-01T10:15:00Z'
                updatedAt: '2026-08-01T12:00:00Z'
                steps:
                  - {recordedAt: '2026-08-01T10:16:00Z', kind: DECISION, summary: Selected eligible local supply., confidence: 0.82}
        default: {$ref: '#/components/responses/Problem'}
  /v1/events/stream:
    get:
      tags: [Operations]
      operationId: streamEvents
      summary: Stream role-filtered domain events with replay
      parameters:
        - name: simulationRunId
          in: query
          schema: {type: string, format: uuid}
        - name: Last-Event-ID
          in: header
          description: Last fully applied monotonic decimal cursor; the server replays later retained events.
          schema: {type: string, pattern: '^[0-9]+$'}
      responses:
        '200':
          description: SSE frames use `id`, `event`, and JSON `data` containing EventEnvelope.
          headers:
            Cache-Control:
              schema: {type: string, const: no-cache}
          content:
            text/event-stream:
              schema: {type: string}
              example: |-
                id: 42
                event: ORDER_FULFILLED
                data: {"eventId":"aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa","eventType":"ORDER_FULFILLED","occurredAt":"2026-08-12T13:45:00Z"}
        '409':
          description: Replay cursor is invalid or older than retained history; refresh a snapshot before reconnecting.
          content:
            application/problem+json:
              schema: {$ref: './common.schema.json#/$defs/Problem'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/simulation-scenarios:
    get:
      tags: [Simulation]
      operationId: listSimulationScenarios
      summary: List safe scenario metadata available for saved runs
      responses:
        '200':
          description: Available scenarios, policies, islands, and evidence provenance.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationScenarioPage'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/simulation-runs:
    get:
      tags: [Simulation]
      operationId: listSimulationRuns
      summary: List saved immutable simulation runs
      parameters:
        - {name: scenarioId, in: query, schema: {type: string}}
        - {name: policy, in: query, schema: {enum: [BASELINE, HARVEST]}}
        - {name: status, in: query, schema: {enum: [CREATING, COMPLETED, FAILED]}}
        - $ref: '#/components/parameters/Cursor'
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Recent saved runs without their full replay frames.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationRunPage'}
        default: {$ref: '#/components/responses/Problem'}
    post:
      tags: [Simulation]
      operationId: createSimulationRun
      summary: Execute and save a deterministic run or disruption-derived run
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulationRunCreate'}
            example:
              scenarioId: saint-lucia-demo-v1
              policy: HARVEST
              seed: 8675309
              decisionMode: DETERMINISTIC
              scope: {mode: SELECTED, islandIds: [saint-lucia]}
      responses:
        '201':
          description: Completed saved run metadata; replay is read through the timeline/world endpoints.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationRun'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/simulation-runs/{runId}:
    get:
      tags: [Simulation]
      operationId: getSimulationRun
      summary: Read saved run configuration, status, metrics, and evidence
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Saved run metadata without replay frames or hidden truth.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationRun'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/simulation-runs/{runId}/timeline:
    get:
      tags: [Simulation]
      operationId: getSimulationTimeline
      summary: Load the complete immutable observable replay timeline
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Static scene and ordered observable frames for local playback.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationTimeline'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/simulation-runs/{runId}/participant-sessions:
    post:
      tags: [Simulation]
      operationId: createSimulationParticipantSession
      summary: Create a short-lived read-only session for a completed synthetic participant
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SimulationParticipantSessionCreate'}
      responses:
        '201':
          description: Fifteen-minute participant replay session.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationParticipantSession'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/simulation-runs/{runId}/world:
    get:
      tags: [Simulation]
      operationId: getSimulationWorldFrame
      summary: Read one saved observable replay frame
      parameters:
        - $ref: '#/components/parameters/RunId'
        - name: frameIndex
          in: query
          required: true
          schema: {type: integer, minimum: 0}
      responses:
        '200':
          description: One immutable observable frame; never hidden crop truth.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SimulationWorldFrame'}
        default: {$ref: '#/components/responses/Problem'}
  /v1/paired-runs:
    post:
      tags: [Simulation]
      operationId: createPairedRun
      summary: Execute and save baseline and Harvest runs with identical inputs
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PairedRunCreate'}
            example:
              scenarioId: saint-lucia-demo-v1
              seed: 8675309
              decisionMode: DETERMINISTIC
              scope: {mode: SELECTED, islandIds: [saint-lucia]}
      responses:
        '201':
          description: Completed paired runs and their synthetic comparison.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairedRun'}
              example:
                pairId: 30303030-3030-4030-8030-303030303030
                scenarioId: saint-lucia-demo-v1
                seed: 8675309
                baselineRunId: 31313131-3131-4131-8131-313131313131
                harvestRunId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                status: COMPLETED
        default: {$ref: '#/components/responses/Problem'}
  /v1/paired-runs/{pairId}:
    get:
      tags: [Simulation]
      operationId: getPairedRun
      summary: Read a saved paired-run comparison
      parameters:
        - $ref: '#/components/parameters/PairId'
      responses:
        '200':
          description: Pair status and result when complete.
          content:
            application/json:
              schema: {$ref: '#/components/schemas/PairedRun'}
              example:
                pairId: 30303030-3030-4030-8030-303030303030
                scenarioId: saint-lucia-demo-v1
                seed: 8675309
                baselineRunId: 31313131-3131-4131-8131-313131313131
                harvestRunId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                status: COMPLETED
                result:
                  baseline: {localProcurementRate: 0.44, fulfilmentRate: 0.68, wasteQuantity: {value: 170, unit: kg}}
                  harvest: {localProcurementRate: 0.7, fulfilmentRate: 0.91, wasteQuantity: {value: 80, unit: kg}}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Supabase-compatible human bearer JWT.
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Unique mutation key scoped to authenticated actor, method, and path. Reuse with a different body returns 409.
      schema:
        type: string
        minLength: 8
        maxLength: 128
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]+$'
      example: web-20260801-000001
    Cursor:
      name: cursor
      in: query
      schema: {type: string, minLength: 1}
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    CropBatchId: {$ref: '#/components/parameters/UuidCropBatch'}
    UuidCropBatch:
      name: cropBatchId
      in: path
      required: true
      schema: {type: string, format: uuid}
    OrderId:
      name: orderId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ListingId:
      name: listingId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PredictionId:
      name: predictionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ApprovalId:
      name: approvalId
      in: path
      required: true
      schema: {type: string, format: uuid}
    MissionId:
      name: missionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    DeliveryId:
      name: deliveryId
      in: path
      required: true
      schema: {type: string, format: uuid}
    ExceptionId:
      name: exceptionId
      in: path
      required: true
      schema: {type: string, format: uuid}
    VerificationTaskId:
      name: taskId
      in: path
      required: true
      schema: {type: string, format: uuid}
    TraceId:
      name: traceId
      in: path
      required: true
      schema: {type: string, format: uuid}
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PairId:
      name: pairId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Problem:
      description: RFC 7807 error. Common cases are 400 validation, 401 authentication, 403 role/scope, 404, 409 state/idempotency conflict, and 422 invariant failure.
      content:
        application/problem+json:
          schema: {$ref: './common.schema.json#/$defs/Problem'}
          example:
            type: /problems/validation
            title: Request validation failed
            status: 400
            code: VALIDATION_FAILED
            detail: quantity.unit must be kg
  schemas:
    CurrentActor:
      type: object
      additionalProperties: false
      required: [actorId, authSubject, name, role, synthetic, readOnly]
      properties:
        actorId: {type: string, format: uuid}
        authSubject: {type: string}
        name: {type: string}
        role: {$ref: './common.schema.json#/$defs/ActorRole'}
        synthetic: {type: boolean}
        serviceZone: {type: string}
        simulationRunId: {type: string, format: uuid}
        simulationRunStatus: {enum: [CREATING, COMPLETED, FAILED, UNKNOWN]}
        readOnly: {type: boolean}
        location: {$ref: './common.schema.json#/$defs/GeoPoint'}
    CropObservationIntakeCreate:
      type: object
      additionalProperties: false
      required: [cropBatchId, observedAt, sourceType, sourceText, provenance]
      properties:
        cropBatchId: {type: string, format: uuid}
        observedAt: {type: string, format: date-time}
        sourceType: {enum: [TEXT, VOICE_TRANSCRIPT, COORDINATOR_NOTE]}
        sourceText: {type: string, minLength: 1, maxLength: 4000}
        provenance: {$ref: './common.schema.json#/$defs/Provenance'}
    CropObservationDraft:
      type: object
      additionalProperties: false
      required: [suggestedCropStage, fieldConfidence, confidence, warnings]
      properties:
        suggestedCropStage:
          anyOf:
            - {enum: [GROWING, FLOWERING, FRUITING, HARVEST_READY, HARVESTED]}
            - {type: 'null'}
        suggestedEstimatedQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
        suggestedNotes: {type: string, maxLength: 4000}
        fieldConfidence:
          type: object
          additionalProperties: false
          required: [cropStage, estimatedQuantity, notes]
          properties:
            cropStage: {type: number, minimum: 0, maximum: 1}
            estimatedQuantity: {type: number, minimum: 0, maximum: 1}
            notes: {type: number, minimum: 0, maximum: 1}
        confidence: {type: number, minimum: 0, maximum: 1}
        warnings: {type: array, items: {type: string}}
    CropObservationIntake:
      type: object
      additionalProperties: false
      required: [intakeId, cropBatchId, observedAt, sourceType, status, draft, promptId, adapter, provenance, traceId, createdAt]
      properties:
        intakeId: {type: string, format: uuid}
        cropBatchId: {type: string, format: uuid}
        observedAt: {type: string, format: date-time}
        sourceType: {enum: [TEXT, VOICE_TRANSCRIPT, COORDINATOR_NOTE]}
        status: {enum: [DRAFT, CONFIRMED]}
        draft: {$ref: '#/components/schemas/CropObservationDraft'}
        promptId: {type: string}
        adapter: {type: string}
        provenance: {$ref: './common.schema.json#/$defs/Provenance'}
        traceId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        confirmedObservationId: {type: string, format: uuid}
        confirmedAt: {type: string, format: date-time}
    CropObservationCreate:
      type: object
      additionalProperties: false
      required: [cropBatchId, observedAt, cropStage, provenance]
      properties:
        cropBatchId: {type: string, format: uuid}
        observedAt: {type: string, format: date-time}
        cropStage: {type: string, minLength: 1, maxLength: 80}
        notes: {type: string, maxLength: 2000}
        estimatedQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
        provenance: {$ref: './common.schema.json#/$defs/Provenance'}
        intakeId: {type: string, format: uuid}
    CropObservation:
      type: object
      additionalProperties: false
      required: [observationId, cropBatchId, observedAt, recordedAt, cropStage, provenance, traceId]
      properties:
        observationId: {type: string, format: uuid}
        cropBatchId: {type: string, format: uuid}
        observedAt: {type: string, format: date-time}
        recordedAt: {type: string, format: date-time}
        cropStage: {type: string, minLength: 1, maxLength: 80}
        notes: {type: string, maxLength: 2000}
        estimatedQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
        provenance: {$ref: './common.schema.json#/$defs/Provenance'}
        traceId: {type: string, format: uuid}
        intakeId: {type: string, format: uuid}
    CropBatch:
      type: object
      additionalProperties: false
      required: [cropBatchId, farmId, cropType, status, availableToPromise, provenance]
      properties:
        cropBatchId: {type: string, format: uuid}
        farmId: {type: string, format: uuid}
        cropType: {type: string, minLength: 1}
        status: {enum: [PLANNED, GROWING, HARVEST_READY, HARVESTED, CLOSED]}
        latestObservationId: {type: string, format: uuid}
        latestPredictionId: {type: string, format: uuid}
        availableToPromise: {$ref: './common.schema.json#/$defs/Quantity'}
        provenance: {$ref: './common.schema.json#/$defs/Provenance'}
        verificationStatus: {$ref: '#/components/schemas/VerificationStatus'}
        latestDecision: {$ref: '#/components/schemas/BatchDecisionExplanation'}
    BatchDecisionExplanation:
      description: >-
        Latest actionable rejection affecting this batch: a coordinator
        REQUEST_CHANGES decision or a rejected delivery line. Present only when
        such a decision exists. Traceability evidence, not food-safety
        certification.
      type: object
      additionalProperties: false
      required: [source, decidedAt]
      properties:
        source: {enum: [VERIFICATION, DELIVERY]}
        reasonCode: {$ref: '#/components/schemas/DecisionReasonCode'}
        nextAction: {$ref: '#/components/schemas/DecisionNextAction'}
        note: {type: string, maxLength: 1000}
        decidedAt: {type: string, format: date-time}
    CropBatchPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CropBatch'}}
        pageInfo: {$ref: './common.schema.json#/$defs/PageInfo'}
    CropStandardSource:
      type: object
      additionalProperties: false
      required: [title, url, licence, retrievedAt]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        url: {type: string, format: uri, minLength: 1, maxLength: 2000}
        licence: {type: string, minLength: 1, maxLength: 300}
        retrievedAt: {type: string, format: date}
    CropStandardChecklistItem:
      type: object
      additionalProperties: false
      required: [key, requirement]
      properties:
        key: {enum: [VARIETY, SIZE_AND_GRADE, MATURITY_AND_APPEARANCE, PERMITTED_DEFECTS, CLEANING, PACKAGING]}
        requirement: {type: string, minLength: 1, maxLength: 2000}
    CropStandardImage:
      type: object
      additionalProperties: false
      required: [url, licence, attribution, alt, acceptable]
      properties:
        url: {type: string, format: uri, minLength: 1, maxLength: 2000}
        licence: {type: string, minLength: 1, maxLength: 300}
        attribution: {type: string, minLength: 1, maxLength: 500}
        alt: {type: string, minLength: 1, maxLength: 500}
        acceptable: {type: boolean}
    CropStandardGuidanceSource:
      type: object
      additionalProperties: false
      required: [title, url, retrievedAt]
      properties:
        title: {type: string, minLength: 1, maxLength: 300}
        url: {type: string, format: uri, minLength: 1, maxLength: 2000}
        retrievedAt: {type: string, format: date}
    CropStandardGuidanceItem:
      type: object
      additionalProperties: false
      required: [topic, text, source]
      properties:
        topic: {enum: [HARVEST_WINDOW, PEST_AND_DISEASE_SIGNS, GOOD_AGRICULTURAL_PRACTICE, HARVEST_READINESS, SORTING_GRADING_CLEANING_STORAGE]}
        text: {type: string, minLength: 1, maxLength: 4000}
        source: {$ref: '#/components/schemas/CropStandardGuidanceSource'}
    CropStandardCreate:
      type: object
      additionalProperties: false
      required: [cropType, status, reviewedAt, geography, source, checklist, images, guidance]
      properties:
        cropType: {type: string, minLength: 1, maxLength: 100}
        status: {enum: [DRAFT, PUBLISHED]}
        reviewedAt: {type: string, format: date-time}
        geography: {type: string, minLength: 1, maxLength: 300}
        source: {$ref: '#/components/schemas/CropStandardSource'}
        checklist:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/CropStandardChecklistItem'}
        images:
          type: array
          items: {$ref: '#/components/schemas/CropStandardImage'}
        guidance:
          type: array
          minItems: 1
          uniqueItems: true
          items: {$ref: '#/components/schemas/CropStandardGuidanceItem'}
    CropStandard:
      type: object
      additionalProperties: false
      required: [standardId, cropType, publisherActorId, publisherName, version, status, reviewedAt, geography, source, checklist, images, guidance]
      properties:
        standardId: {type: string, format: uuid}
        cropType: {type: string, minLength: 1, maxLength: 100}
        publisherActorId: {type: string, format: uuid}
        publisherName: {type: string, minLength: 1, maxLength: 300}
        version: {type: integer, minimum: 1}
        status: {enum: [DRAFT, PUBLISHED]}
        reviewedAt: {type: string, format: date-time}
        geography: {type: string, minLength: 1, maxLength: 300}
        source: {$ref: '#/components/schemas/CropStandardSource'}
        checklist:
          type: array
          items: {$ref: '#/components/schemas/CropStandardChecklistItem'}
        images:
          type: array
          items: {$ref: '#/components/schemas/CropStandardImage'}
        guidance:
          type: array
          items: {$ref: '#/components/schemas/CropStandardGuidanceItem'}
    CropStandardPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/CropStandard'}}
        pageInfo: {$ref: './common.schema.json#/$defs/PageInfo'}
    ForecastRequest:
      type: object
      additionalProperties: false
      required: [reason]
      properties:
        reason: {enum: [NEW_OBSERVATION, MANUAL_REFRESH, SCHEDULED_REFRESH]}
    ForecastJob:
      type: object
      additionalProperties: false
      required: [forecastRequestId, cropBatchId, status, requestedAt]
      properties:
        forecastRequestId: {type: string, format: uuid}
        cropBatchId: {type: string, format: uuid}
        status: {enum: [QUEUED, RUNNING, COMPLETED, FAILED]}
        requestedAt: {type: string, format: date-time}
    YieldPredictionEvidence:
      type: object
      additionalProperties: false
      required: [predictionId, requestId, cropBatchId, modelVersion, q10MarketableYield, q50MarketableYield, q90MarketableYield, harvestWindow, readiness, confidence, warnings, featureSnapshot, provenance, generatedAt]
      properties:
        predictionId: {type: string, format: uuid}
        requestId: {type: string, format: uuid}
        cropBatchId: {type: string, format: uuid}
        modelVersion: {type: string, minLength: 1}
        q10MarketableYield: {$ref: './common.schema.json#/$defs/Quantity'}
        q50MarketableYield: {$ref: './common.schema.json#/$defs/Quantity'}
        q90MarketableYield: {$ref: './common.schema.json#/$defs/Quantity'}
        harvestWindow: {$ref: './common.schema.json#/$defs/DateRange'}
        readiness: {type: number, minimum: 0, maximum: 1}
        confidence: {type: number, minimum: 0, maximum: 1}
        warnings: {type: array, uniqueItems: true, items: {type: string}}
        featureSnapshot:
          type: object
          additionalProperties: true
          description: Allow-listed feature evidence stored by the Product API; never model artefacts or simulation hidden truth.
        provenance: {const: MODEL_PREDICTED}
        generatedAt: {type: string, format: date-time}
        actualOutcome: {$ref: './common.schema.json#/$defs/Quantity'}
        evaluation:
          type: object
          additionalProperties: false
          required: [absoluteError, intervalCovered]
          properties:
            absoluteError: {$ref: './common.schema.json#/$defs/Quantity'}
            intervalCovered: {type: boolean}
    ListingCreate:
      type: object
      additionalProperties: false
      required: [cropBatchId, quantity, unitPrice, availableFrom, availableUntil]
      properties:
        cropBatchId: {type: string, format: uuid}
        quantity: {$ref: './common.schema.json#/$defs/Quantity'}
        unitPrice: {$ref: './common.schema.json#/$defs/Money'}
        availableFrom: {type: string, format: date}
        availableUntil: {type: string, format: date}
    Listing:
      type: object
      additionalProperties: false
      required: [listingId, cropBatchId, farmerId, cropType, quantity, unitPrice, availableFrom, availableUntil, status, createdAt]
      properties:
        listingId: {type: string, format: uuid}
        cropBatchId: {type: string, format: uuid}
        farmerId: {type: string, format: uuid}
        cropType: {type: string}
        quantity: {$ref: './common.schema.json#/$defs/Quantity'}
        unitPrice: {$ref: './common.schema.json#/$defs/Money'}
        availableFrom: {type: string, format: date}
        availableUntil: {type: string, format: date}
        status: {enum: [ACTIVE, RESERVED, SOLD_OUT, WITHDRAWN, EXPIRED]}
        createdAt: {type: string, format: date-time}
    ListingPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Listing'}}
        pageInfo: {$ref: './common.schema.json#/$defs/PageInfo'}
    SupplyEvidence:
      type: object
      additionalProperties: false
      required: [provenance, verificationStatus]
      properties:
        provenance: {$ref: './common.schema.json#/$defs/Provenance'}
        confidence: {type: number, minimum: 0, maximum: 1}
        forecastGeneratedAt: {type: string, format: date-time}
        harvestWindow: {$ref: './common.schema.json#/$defs/DateRange'}
        verificationStatus: {$ref: '#/components/schemas/VerificationStatus'}
        warnings: {type: array, items: {type: string}}
    ListingDetail:
      allOf:
        - $ref: '#/components/schemas/Listing'
        - type: object
          required: [productionZone, supplyEvidence]
          properties:
            productionZone: {type: string, minLength: 1}
            supplyEvidence: {$ref: '#/components/schemas/SupplyEvidence'}
    MarketOpportunity:
      type: object
      additionalProperties: false
      required: [opportunityId, cropType, quantity, neededBy, deliveryZone, createdAt]
      properties:
        opportunityId: {type: string, format: uuid}
        cropType: {type: string, minLength: 1}
        quantity: {$ref: './common.schema.json#/$defs/Quantity'}
        neededBy: {type: string, format: date-time}
        deliveryZone: {type: string, minLength: 1}
        maxUnitPrice: {$ref: './common.schema.json#/$defs/Money'}
        createdAt: {type: string, format: date-time}
    MarketOpportunityPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/MarketOpportunity'}}
        pageInfo: {$ref: './common.schema.json#/$defs/PageInfo'}
    BuyerDemandCreate:
      type: object
      additionalProperties: false
      required: [cropType, quantity, neededBy, deliveryLocation]
      properties:
        cropType: {type: string, minLength: 1}
        quantity: {$ref: './common.schema.json#/$defs/Quantity'}
        neededBy: {type: string, format: date-time}
        deliveryLocation: {$ref: './common.schema.json#/$defs/GeoPoint'}
        maxUnitPrice: {$ref: './common.schema.json#/$defs/Money'}
    BuyerDemand:
      type: object
      additionalProperties: false
      required: [demandId, buyerId, cropType, quantity, neededBy, deliveryLocation, status, createdAt]
      properties:
        demandId: {type: string, format: uuid}
        buyerId: {type: string, format: uuid}
        cropType: {type: string, minLength: 1}
        quantity: {$ref: './common.schema.json#/$defs/Quantity'}
        neededBy: {type: string, format: date-time}
        deliveryLocation: {$ref: './common.schema.json#/$defs/GeoPoint'}
        maxUnitPrice: {$ref: './common.schema.json#/$defs/Money'}
        status: {enum: [OPEN, MATCHING, SATISFIED, CANCELLED]}
        createdAt: {type: string, format: date-time}
    BuyerDemandPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/BuyerDemand'}}
        pageInfo: {$ref: './common.schema.json#/$defs/PageInfo'}
    OrderCreate:
      type: object
      additionalProperties: false
      required: [cropType, requestedQuantity, neededBy, deliveryLocation]
      properties:
        cropType: {type: string, minLength: 1}
        requestedQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
        neededBy: {type: string, format: date-time}
        deliveryLocation: {$ref: './common.schema.json#/$defs/GeoPoint'}
        minimumAcceptableFraction:
          description: >-
            The smallest share of `requestedQuantity` this buyer will accept as
            a commitment. Matching may propose a partial allocation at or above
            this share instead of leaving the order waiting for complete cover.
            Optional; the Product API applies 0.8 when it is omitted. That
            default is stakeholder-calibrated from hotel buyer feedback that
            hotels routinely take part of an order and source the remainder
            elsewhere.
          type: number
          minimum: 0.5
          maximum: 1
        listingIds:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
    Order:
      type: object
      additionalProperties: false
      required: [orderId, buyerId, cropType, requestedQuantity, committedQuantity, acceptedQuantity, minimumAcceptableFraction, neededBy, lifecycleStatus, atRisk, createdAt, updatedAt]
      properties:
        orderId: {type: string, format: uuid}
        buyerId: {type: string, format: uuid}
        cropType: {type: string}
        requestedQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
        committedQuantity:
          description: >-
            Quantity actually reserved at approval. Zero until an allocation is
            approved, and below `requestedQuantity` on a safe partial
            commitment.
          $ref: './common.schema.json#/$defs/Quantity'
        acceptedQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
        minimumAcceptableFraction:
          description: Buyer's accepted share of `requestedQuantity` for this order.
          type: number
          minimum: 0.5
          maximum: 1
        neededBy: {type: string, format: date-time}
        lifecycleStatus: {$ref: '#/components/schemas/OrderStatus'}
        atRisk: {type: boolean}
        activeExceptionIds:
          type: array
          uniqueItems: true
          items: {type: string, format: uuid}
        cropStandardId: {type: string, format: uuid}
        traceId: {type: string, format: uuid}
        allocation: {$ref: '#/components/schemas/AllocationSummary'}
        outcomeCause: {$ref: '#/components/schemas/OrderOutcomeCause'}
        outcomeNote: {type: string, maxLength: 300}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    OrderStatus:
      enum: [REQUESTED, ALLOCATION_PROPOSED, AWAITING_APPROVAL, COMMITTED, IN_DELIVERY, FULFILLED, PARTIALLY_FULFILLED, REJECTED, CANCELLED]
    OrderOutcomeCause:
      description: >-
        The latest recorded reason an order is not (yet) fulfilled. Written at
        each matching, approval, and delivery decision so an unfulfilled order
        always carries one explainable cause; absent on fulfilled orders.
      enum: [NO_READY_SUPPLY, INSUFFICIENT_SUPPLY, SUPPLY_CHANGED, APPROVAL_REJECTED, APPROVAL_TIMEOUT, MISSION_LATE, DELIVERY_REJECTED, CANCELLED, HORIZON_TRUNCATED]
    OrderPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Order'}}
        pageInfo: {$ref: './common.schema.json#/$defs/PageInfo'}
    ApprovalSummary:
      type: object
      additionalProperties: false
      required: [required, approved, pending, rejected]
      properties:
        required: {type: integer, minimum: 0}
        approved: {type: integer, minimum: 0}
        pending: {type: integer, minimum: 0}
        rejected: {type: integer, minimum: 0}
        myApprovalId: {type: string, format: uuid}
        myApprovalStatus: {enum: [PENDING, APPROVED, REJECTED, CANCELLED]}
    OrderDetail:
      allOf:
        - $ref: '#/components/schemas/Order'
        - type: object
          required: [approvalSummary]
          properties:
            approvalSummary: {$ref: '#/components/schemas/ApprovalSummary'}
            deliveryMission: {$ref: '#/components/schemas/DeliveryMission'}
            deliveryAcceptance: {$ref: '#/components/schemas/DeliveryAcceptance'}
    ApprovalDecision:
      description: >-
        REJECT must carry reasonCode and nextAction so the affected participant
        receives an actionable explanation.
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {enum: [APPROVE, REJECT]}
        reason: {type: string, maxLength: 1000}
        reasonCode: {$ref: '#/components/schemas/DecisionReasonCode'}
        nextAction: {$ref: '#/components/schemas/DecisionNextAction'}
    Approval:
      type: object
      additionalProperties: false
      required: [approvalId, subjectType, subjectId, requestedFromActorId, status, requestedAt]
      properties:
        approvalId: {type: string, format: uuid}
        subjectType: {enum: [ALLOCATION, RECOVERY, CANCELLATION, SUBSTITUTION, PRICE_CHANGE, LOCATION_DISCLOSURE, PRODUCE_REJECTION, INTER_ISLAND_COMMITMENT]}
        subjectId: {type: string, format: uuid}
        requestedFromActorId: {type: string, format: uuid}
        status: {enum: [PENDING, APPROVED, REJECTED, CANCELLED]}
        requestedAt: {type: string, format: date-time}
        decidedBy: {type: string, format: uuid}
        decidedAt: {type: string, format: date-time}
        reason: {type: string, maxLength: 1000}
        reasonCode: {$ref: '#/components/schemas/DecisionReasonCode'}
        nextAction: {$ref: '#/components/schemas/DecisionNextAction'}
        context: {$ref: '#/components/schemas/ApprovalContext'}
    ApprovalContext:
      type: object
      additionalProperties: false
      required: [title, summary]
      properties:
        title: {type: string, minLength: 1}
        summary: {type: string, minLength: 1}
        orderId: {type: string, format: uuid}
        cropType: {type: string}
        quantity: {$ref: './common.schema.json#/$defs/Quantity'}
        coverage: {$ref: '#/components/schemas/AllocationCoverage'}
        estimatedPrice: {$ref: './common.schema.json#/$defs/Money'}
        neededBy: {type: string, format: date-time}
        exceptionId: {type: string, format: uuid}
        recoveryAction: {enum: [REALLOCATE, REROUTE, RESCHEDULE, SUBSTITUTE, CANCEL]}
    AllocationCoverage:
      description: >-
        How much of the buyer's requested quantity this proposal commits.
        A partial proposal is only offered at or above the order's
        `minimumAcceptableFraction`.
      type: object
      additionalProperties: false
      required: [requestedQuantity, proposedQuantity, coverageFraction, partial]
      properties:
        requestedQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
        proposedQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
        coverageFraction: {type: number, minimum: 0, maximum: 1}
        partial: {type: boolean}
    AllocationSummary:
      type: object
      additionalProperties: false
      required: [allocationId, status, lines]
      properties:
        allocationId: {type: string, format: uuid}
        status: {enum: [PROPOSED, APPROVED, REJECTED]}
        lines:
          type: array
          items: {$ref: '#/components/schemas/AllocationLineSummary'}
    AllocationLineSummary:
      type: object
      additionalProperties: false
      required: [cropBatchId, quantity]
      properties:
        cropBatchId: {type: string, format: uuid}
        quantity: {$ref: './common.schema.json#/$defs/Quantity'}
    ApprovalPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Approval'}}
        pageInfo: {$ref: './common.schema.json#/$defs/PageInfo'}
    MissionStatus:
      enum: [AVAILABLE, ASSIGNED, PICKUP_IN_PROGRESS, IN_TRANSIT, DELIVERED, CANCELLED]
    DeliveryStop:
      type: object
      additionalProperties: false
      required: [sequence, kind, location]
      properties:
        sequence: {type: integer, minimum: 1}
        kind: {enum: [PICKUP, DROPOFF]}
        farmId: {type: string, format: uuid}
        cropBatchIds: {type: array, uniqueItems: true, items: {type: string, format: uuid}}
        quantity: {$ref: './common.schema.json#/$defs/Quantity'}
        location: {$ref: './common.schema.json#/$defs/GeoPoint'}
    DeliveryMission:
      type: object
      additionalProperties: false
      required: [missionId, orderId, status, quantity, deadline, stops, currentStopSequence]
      properties:
        missionId: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        status: {$ref: '#/components/schemas/MissionStatus'}
        transporterId: {type: string, format: uuid}
        vehicleId: {type: string, format: uuid}
        quantity: {$ref: './common.schema.json#/$defs/Quantity'}
        deadline: {type: string, format: date-time}
        stops: {type: array, minItems: 2, items: {$ref: '#/components/schemas/DeliveryStop'}}
        currentStopSequence: {type: integer, minimum: 0}
        estimatedDistanceKm: {type: number, minimum: 0}
        estimatedDurationMinutes: {type: integer, minimum: 0}
        estimatedArrival: {type: string, format: date-time}
    MissionPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DeliveryMission'}}
        pageInfo: {$ref: './common.schema.json#/$defs/PageInfo'}
    MissionAcceptance:
      type: object
      additionalProperties: false
      required: [decision, vehicleId]
      properties:
        decision: {const: ACCEPT}
        vehicleId: {type: string, format: uuid}
    DeliveryUpdateCreate:
      type: object
      additionalProperties: false
      required: [updateType, recordedAt]
      properties:
        updateType: {enum: [PICKED_UP, POSITION, DELAYED, ARRIVED, DELIVERED]}
        recordedAt: {type: string, format: date-time}
        position: {$ref: './common.schema.json#/$defs/GeoPoint'}
        quantity: {$ref: './common.schema.json#/$defs/Quantity'}
        note: {type: string, maxLength: 500}
    DeliveryUpdate:
      type: object
      additionalProperties: false
      required: [updateId, missionId, updateType, recordedAt]
      properties:
        updateId: {type: string, format: uuid}
        missionId: {type: string, format: uuid}
        updateType: {enum: [PICKED_UP, POSITION, DELAYED, ARRIVED, DELIVERED]}
        recordedAt: {type: string, format: date-time}
        position: {$ref: './common.schema.json#/$defs/GeoPoint'}
        quantity: {$ref: './common.schema.json#/$defs/Quantity'}
        note: {type: string, maxLength: 500}
        stopSequence: {type: integer, minimum: 1}
    DeliveryUpdatePage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/DeliveryUpdate'}}
        pageInfo: {$ref: './common.schema.json#/$defs/PageInfo'}
    Vehicle:
      type: object
      additionalProperties: false
      required: [vehicleId, label, status]
      properties:
        vehicleId: {type: string, format: uuid}
        label: {type: string, minLength: 1}
        registrationNumber: {type: string}
        capacity: {$ref: './common.schema.json#/$defs/Quantity'}
        status: {enum: [AVAILABLE, IN_USE, INACTIVE]}
    VehiclePage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/Vehicle'}}
        pageInfo: {$ref: './common.schema.json#/$defs/PageInfo'}
    VerificationStatus:
      enum: [OPEN, VERIFIED, CHANGES_REQUESTED, UNVERIFIED]
    DecisionReasonCode:
      description: >-
        Structured reason a participant rejected produce, requested changes, or
        declined an approval. It records an operational quality judgement for
        traceability; it is not a food-safety certification.
      enum: [QUANTITY_MISMATCH, MATURITY_OR_QUALITY, DAMAGE, CLEANLINESS, SIZE_OR_GRADE, MISSING_INFORMATION, OTHER]
    DecisionNextAction:
      description: Plain-language action the affected farmer should take next.
      type: string
      minLength: 1
      maxLength: 300
    VerificationTask:
      type: object
      additionalProperties: false
      required: [taskId, farmId, cropBatchId, subjectType, subjectId, taskType, status, summary, createdAt]
      properties:
        taskId: {type: string, format: uuid}
        farmId: {type: string, format: uuid}
        cropBatchId: {type: string, format: uuid}
        subjectType: {const: CROP_OBSERVATION}
        subjectId: {type: string, format: uuid}
        taskType: {const: VERIFY_OBSERVATION}
        status: {$ref: '#/components/schemas/VerificationStatus'}
        summary: {type: string, minLength: 1}
        createdAt: {type: string, format: date-time}
        resolvedBy: {type: string, format: uuid}
        resolvedAt: {type: string, format: date-time}
        note: {type: string, maxLength: 1000}
        reasonCode: {$ref: '#/components/schemas/DecisionReasonCode'}
        nextAction: {$ref: '#/components/schemas/DecisionNextAction'}
    VerificationTaskPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/VerificationTask'}}
        pageInfo: {$ref: './common.schema.json#/$defs/PageInfo'}
    VerificationDecision:
      description: >-
        REQUEST_CHANGES must carry reasonCode and nextAction so the farmer is
        told what was wrong and what to do next.
      type: object
      additionalProperties: false
      required: [decision]
      properties:
        decision: {enum: [VERIFY, REQUEST_CHANGES]}
        note: {type: string, maxLength: 1000}
        reasonCode: {$ref: '#/components/schemas/DecisionReasonCode'}
        nextAction: {$ref: '#/components/schemas/DecisionNextAction'}
    ExceptionCreate:
      type: object
      additionalProperties: false
      required: [exceptionType, severity, affectedEntityIds, description, provenance]
      properties:
        exceptionType: {enum: [SHORTFALL, DELAY, QUALITY, VEHICLE, WEATHER, OTHER]}
        severity: {enum: [LOW, MEDIUM, HIGH, CRITICAL]}
        affectedEntityIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}
        description: {type: string, minLength: 1, maxLength: 1000}
        provenance: {$ref: './common.schema.json#/$defs/Provenance'}
    OperationalException:
      type: object
      additionalProperties: false
      required: [exceptionId, exceptionType, severity, affectedEntityIds, description, status, provenance, reportedAt]
      properties:
        exceptionId: {type: string, format: uuid}
        exceptionType: {enum: [SHORTFALL, DELAY, QUALITY, VEHICLE, WEATHER, OTHER]}
        severity: {enum: [LOW, MEDIUM, HIGH, CRITICAL]}
        affectedEntityIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, format: uuid}}
        description: {type: string, minLength: 1, maxLength: 1000}
        status: {enum: [OPEN, RECOVERY_PENDING, RESOLVED]}
        provenance: {$ref: './common.schema.json#/$defs/Provenance'}
        reportedAt: {type: string, format: date-time}
        traceId: {type: string, format: uuid}
    RecoveryProposal:
      type: object
      additionalProperties: false
      required: [action, summary, changes]
      properties:
        action: {enum: [REALLOCATE, REROUTE, RESCHEDULE, SUBSTITUTE, CANCEL]}
        summary: {type: string, minLength: 1}
        changes:
          type: object
          additionalProperties: true
    ExceptionDetail:
      allOf:
        - $ref: '#/components/schemas/OperationalException'
        - type: object
          properties:
            recoveryProposal: {$ref: '#/components/schemas/RecoveryProposal'}
            approvalSummary: {$ref: '#/components/schemas/ApprovalSummary'}
    ExceptionPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/OperationalException'}}
        pageInfo: {$ref: './common.schema.json#/$defs/PageInfo'}
    DeliveryAcceptanceCreate:
      description: >-
        Any rejected quantity must carry reasonCode and nextAction, either on
        the acceptance itself or on every rejected line.
      type: object
      additionalProperties: false
      required: [outcome, acceptedQuantity, rejectedQuantity, lineOutcomes]
      properties:
        outcome: {enum: [ACCEPTED, PARTIALLY_ACCEPTED, REJECTED]}
        acceptedQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
        rejectedQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
        note: {type: string, maxLength: 1000}
        reasonCode: {$ref: '#/components/schemas/DecisionReasonCode'}
        nextAction: {$ref: '#/components/schemas/DecisionNextAction'}
        lineOutcomes:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/DeliveryLineOutcome'}
    DeliveryAcceptance:
      type: object
      additionalProperties: false
      required: [deliveryId, orderId, outcome, acceptedQuantity, rejectedQuantity, lineOutcomes, acceptedBy, acceptedAt]
      properties:
        deliveryId: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        outcome: {enum: [ACCEPTED, PARTIALLY_ACCEPTED, REJECTED]}
        acceptedQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
        rejectedQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
        note: {type: string, maxLength: 1000}
        reasonCode: {$ref: '#/components/schemas/DecisionReasonCode'}
        nextAction: {$ref: '#/components/schemas/DecisionNextAction'}
        acceptedBy: {type: string, format: uuid}
        acceptedAt: {type: string, format: date-time}
        lineOutcomes:
          type: array
          minItems: 1
          items: {$ref: '#/components/schemas/DeliveryLineOutcome'}
    DeliveryLineOutcome:
      type: object
      additionalProperties: false
      required: [cropBatchId, acceptedQuantity, rejectedQuantity]
      properties:
        cropBatchId: {type: string, format: uuid}
        acceptedQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
        rejectedQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
        reasonCode: {$ref: '#/components/schemas/DecisionReasonCode'}
        nextAction: {$ref: '#/components/schemas/DecisionNextAction'}
    OperationsSnapshot:
      type: object
      additionalProperties: false
      required: [generatedAt, activeListings, openDemands, ordersByStatus, orderOutcomes, deliveryAcceptedKg, approvedCommitmentCount, completedMissionCount, activeMissionIds, openExceptionIds]
      properties:
        generatedAt: {type: string, format: date-time}
        simulationRunId: {type: string, format: uuid}
        activeListings: {type: integer, minimum: 0}
        openDemands: {type: integer, minimum: 0}
        ordersByStatus: {type: object, additionalProperties: {type: integer, minimum: 0}}
        orderOutcomes: {$ref: '#/components/schemas/OrderOutcomeSummary'}
        deliveryAcceptedKg: {type: number, minimum: 0}
        approvedCommitmentCount: {type: integer, minimum: 0}
        completedMissionCount: {type: integer, minimum: 0}
        activeMissionIds: {type: array, items: {type: string, format: uuid}}
        openExceptionIds: {type: array, items: {type: string, format: uuid}}
    OrderOutcomeSummary:
      type: object
      additionalProperties: false
      required: [total, fulfilled, partiallyFulfilled, unfulfilled, pending]
      properties:
        total: {type: integer, minimum: 0}
        fulfilled: {type: integer, minimum: 0}
        partiallyFulfilled: {type: integer, minimum: 0}
        unfulfilled: {type: integer, minimum: 0}
        pending: {type: integer, minimum: 0}
        causes:
          description: >-
            One cause per unfulfilled or partially fulfilled order, so the
            counts here sum to those two totals.
          type: object
          additionalProperties: {type: integer, minimum: 0}
    TraceStep:
      type: object
      additionalProperties: false
      required: [recordedAt, kind, summary]
      properties:
        recordedAt: {type: string, format: date-time}
        kind: {enum: [INPUT, EVIDENCE, TOOL_CALL, DECISION, APPROVAL, STATE_CHANGE, OUTCOME]}
        summary: {type: string, minLength: 1, maxLength: 1000}
        confidence: {type: number, minimum: 0, maximum: 1}
        agentName: {type: string, minLength: 1}
        toolName: {type: string, minLength: 1}
        provenance: {$ref: './common.schema.json#/$defs/Provenance'}
        promptId: {type: string, minLength: 1}
        adapter: {type: string, minLength: 1}
        durationMs: {type: integer, minimum: 0}
    AgentTrace:
      type: object
      additionalProperties: false
      required: [traceId, subjectType, subjectId, workflowType, stage, status, summary, createdAt, updatedAt, steps]
      properties:
        traceId: {type: string, format: uuid}
        subjectType: {enum: [CROP_BATCH, ORDER, DELIVERY, EXCEPTION]}
        subjectId: {type: string, format: uuid}
        workflowType: {enum: [GENERAL, CROP_INTELLIGENCE, ORDER_FULFILMENT, EXCEPTION_RECOVERY]}
        stage: {type: string, minLength: 1}
        status: {enum: [RUNNING, WAITING, AWAITING_HUMAN, AWAITING_APPROVAL, COMPLETED, FAILED]}
        summary: {type: string, minLength: 1, maxLength: 2000}
        parentTraceId: {type: string, format: uuid}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
        steps: {type: array, items: {$ref: '#/components/schemas/TraceStep'}}
    SimulationIsland:
      type: object
      additionalProperties: false
      required: [islandId, name, countryCode, countryOrTerritory, bounds, camera, settlements, timeZone, currency, locale, crops, weatherProfile, roadWindingFactor, provenance, warnings]
      properties:
        islandId: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        countryCode: {type: string, pattern: '^[A-Z]{2}$'}
        countryOrTerritory: {type: string, minLength: 1}
        bounds:
          type: object
          additionalProperties: false
          required: [west, south, east, north]
          properties: {west: {type: number}, south: {type: number}, east: {type: number}, north: {type: number}}
        camera:
          type: object
          additionalProperties: false
          required: [latitude, longitude, heightKm]
          properties: {latitude: {type: number}, longitude: {type: number}, heightKm: {type: number, minimum: 1}}
        settlements:
          type: array
          minItems: 1
          items:
            type: object
            additionalProperties: false
            required: [name, latitude, longitude]
            properties: {name: {type: string}, latitude: {type: number}, longitude: {type: number}}
        timeZone: {type: string, minLength: 1}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
        locale: {type: string, minLength: 2}
        crops: {type: array, minItems: 1, items: {type: string, minLength: 1}}
        weatherProfile: {enum: [WET_TROPICAL, SEASONAL_TROPICAL]}
        roadWindingFactor: {type: number, minimum: 1}
        provenance: {enum: [REFERENCE_GEOGRAPHY_WITH_SYNTHETIC_OPERATIONS]}
        warnings: {type: array, items: {type: string, minLength: 1}}
    SimulationScenario:
      type: object
      additionalProperties: false
      required: [scenarioId, description, startsAt, durationDays, availablePolicies, availableDecisionModes, islands, provenanceNote]
      properties:
        scenarioId: {type: string, minLength: 1}
        description: {type: string, minLength: 1}
        startsAt: {type: string, format: date-time}
        durationDays: {type: integer, minimum: 1}
        availablePolicies: {type: array, items: {enum: [BASELINE, HARVEST]}}
        availableDecisionModes: {type: array, items: {enum: [DETERMINISTIC, LLM_ASSISTED]}}
        islands: {type: array, minItems: 1, items: {$ref: '#/components/schemas/SimulationIsland'}}
        provenanceNote: {type: string, minLength: 1}
    SimulationScenarioPage:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SimulationScenario'}}
    SimulationScope:
      oneOf:
        - type: object
          additionalProperties: false
          required: [mode]
          properties: {mode: {const: ALL}}
        - type: object
          additionalProperties: false
          required: [mode, islandIds]
          properties:
            mode: {const: SELECTED}
            islandIds: {type: array, minItems: 1, uniqueItems: true, items: {type: string, minLength: 1}}
    InjectedDisruption:
      type: object
      additionalProperties: false
      required: [type, offsetMs, durationMs, affectedEntityIds, publicDescription]
      properties:
        type: {enum: [WEATHER, ROAD, VEHICLE, CROP, DEMAND]}
        offsetMs:
          type: integer
          minimum: 0
          description: Milliseconds after scenario start; must be strictly before that scenario's horizon.
        durationMs: {type: integer, minimum: 1}
        affectedEntityIds: {type: array, minItems: 1, items: {type: string, minLength: 1}}
        publicDescription: {type: string, minLength: 1, maxLength: 500}
    SimulationRunCreate:
      oneOf:
        - type: object
          additionalProperties: false
          required: [scenarioId, policy, seed, decisionMode, scope]
          properties:
            scenarioId: {type: string, minLength: 1}
            policy: {enum: [BASELINE, HARVEST]}
            seed: {type: integer, minimum: 0, maximum: 4294967295}
            decisionMode: {enum: [DETERMINISTIC, LLM_ASSISTED]}
            scope: {$ref: '#/components/schemas/SimulationScope'}
            disruptions: {type: array, items: {$ref: '#/components/schemas/InjectedDisruption'}}
        - type: object
          additionalProperties: false
          required: [derivedFromRunId, disruptions]
          properties:
            derivedFromRunId: {type: string, format: uuid}
            disruptions: {type: array, minItems: 1, items: {$ref: '#/components/schemas/InjectedDisruption'}}
    SimulationRunMetrics:
      type: object
      additionalProperties: false
      required: [localProcurementRate, fulfilmentRate, wasteQuantity, totalDemandedKg, totalAcceptedKg, totalSubstitutedKg, totalPromisedKg, commitmentsProposed, commitmentsApproved, commitmentsDelivered, demandsFullyMet, demandsPartiallyMet, demandsUnmet, missionsCompleted, missionsCancelled, observationRequests, eventsProcessed]
      properties:
        localProcurementRate: {type: number, minimum: 0, maximum: 1}
        fulfilmentRate: {type: number, minimum: 0, maximum: 1}
        wasteQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
        totalDemandedKg: {type: number, minimum: 0}
        totalAcceptedKg: {type: number, minimum: 0}
        totalSubstitutedKg: {type: number, minimum: 0}
        totalPromisedKg: {type: number, minimum: 0}
        commitmentsProposed: {type: integer, minimum: 0}
        commitmentsApproved: {type: integer, minimum: 0}
        commitmentsDelivered: {type: integer, minimum: 0}
        demandsFullyMet: {type: integer, minimum: 0}
        demandsPartiallyMet: {type: integer, minimum: 0}
        demandsUnmet: {type: integer, minimum: 0}
        missionsCompleted: {type: integer, minimum: 0}
        missionsCancelled: {type: integer, minimum: 0}
        observationRequests: {type: integer, minimum: 0}
        eventsProcessed: {type: integer, minimum: 0}
        productActions:
          type: object
          additionalProperties: false
          required: [attempted, succeeded, rejected, domainEventsCreated]
          properties:
            attempted: {type: integer, minimum: 0}
            succeeded: {type: integer, minimum: 0}
            rejected: {type: integer, minimum: 0}
            domainEventsCreated: {type: integer, minimum: 0}
            finalCounts:
              type: object
              additionalProperties: false
              required: [activeListings, openDemands, ordersByStatus, orderOutcomes, deliveryAcceptedKg, approvedCommitmentCount, completedMissionCount, activeMissions, openExceptions]
              properties:
                activeListings: {type: integer, minimum: 0}
                openDemands: {type: integer, minimum: 0}
                ordersByStatus: {type: object, additionalProperties: {type: integer, minimum: 0}}
                orderOutcomes: {$ref: '#/components/schemas/OrderOutcomeSummary'}
                deliveryAcceptedKg: {type: number, minimum: 0}
                approvedCommitmentCount: {type: integer, minimum: 0}
                completedMissionCount: {type: integer, minimum: 0}
                activeMissions: {type: integer, minimum: 0}
                openExceptions: {type: integer, minimum: 0}
    SimulationRunError:
      type: object
      additionalProperties: false
      required: [code]
      properties:
        code: {type: string}
        detail: {type: [string, 'null']}
    SimulationRun:
      type: object
      additionalProperties: false
      required: [runId, scenarioId, policy, seed, decisionMode, decisionAdapter, scope, resolvedIslandIds, disruptions, status, frameCount, decisionCount, createdAt, updatedAt]
      properties:
        runId: {type: string, format: uuid}
        scenarioId: {type: string, minLength: 1}
        policy: {enum: [BASELINE, HARVEST]}
        seed: {type: integer, minimum: 0, maximum: 4294967295}
        decisionMode: {enum: [DETERMINISTIC, LLM_ASSISTED]}
        decisionAdapter: {type: string, minLength: 1}
        scope: {$ref: '#/components/schemas/SimulationScope'}
        resolvedIslandIds: {type: array, minItems: 1, items: {type: string}}
        disruptions: {type: array, items: {$ref: '#/components/schemas/InjectedDisruption'}}
        derivedFromRunId: {type: string, format: uuid}
        status: {enum: [CREATING, COMPLETED, FAILED]}
        startedAt: {type: string, format: date-time}
        endedAt: {type: string, format: date-time}
        frameCount: {type: integer, minimum: 0}
        decisionCount: {type: integer, minimum: 0}
        metrics: {$ref: '#/components/schemas/SimulationRunMetrics'}
        evidenceLabel: {type: string}
        provenanceNote: {type: string}
        error: {$ref: '#/components/schemas/SimulationRunError'}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
    SimulationRunPage:
      type: object
      additionalProperties: false
      required: [items, pageInfo]
      properties:
        items: {type: array, items: {$ref: '#/components/schemas/SimulationRun'}}
        pageInfo: {$ref: './common.schema.json#/$defs/PageInfo'}
    ObservableActor:
      type: object
      additionalProperties: false
      required: [actorId, role, position, activity]
      properties:
        actorId: {type: string, format: uuid}
        role: {$ref: './common.schema.json#/$defs/ActorRole'}
        position: {$ref: './common.schema.json#/$defs/GeoPoint'}
        activity: {type: string, minLength: 1}
    ObservableRoute:
      type: object
      additionalProperties: false
      required: [missionId, status, path]
      properties:
        missionId: {type: string, format: uuid}
        status: {enum: [PLANNED, ACTIVE, DELAYED, COMPLETED, CANCELLED]}
        path: {type: array, minItems: 2, items: {$ref: './common.schema.json#/$defs/GeoPoint'}}
    ObservableDisruption:
      type: object
      additionalProperties: false
      required: [eventId, type, description, observedAt]
      properties:
        eventId: {type: string, format: uuid}
        type: {enum: [WEATHER, ROAD, VEHICLE, CROP, OTHER]}
        description: {type: string}
        observedAt: {type: string, format: date-time}
    ReplayDecision:
      type: object
      additionalProperties: false
      required: [at, kind, summary, evidence]
      properties:
        at: {type: integer}
        kind: {type: string}
        summary: {type: string}
        evidence: {type: object, additionalProperties: {type: [string, number, boolean]}}
    SimulationParticipant:
      type: object
      additionalProperties: false
      required: [simulationActorId, productActorId, role, displayName, islandId]
      properties:
        simulationActorId: {type: string, format: uuid}
        productActorId: {type: [string, 'null'], format: uuid}
        role: {enum: [FARMER, BUYER, TRANSPORTER, COORDINATOR]}
        displayName: {type: string, minLength: 1}
        islandId: {type: string, minLength: 1}
    SimulationAgentAction:
      type: object
      additionalProperties: false
      required: [actionId, at, simulationActorId, productActorId, role, toolName, status, summary, eventIds, adapter]
      properties:
        actionId: {type: string, format: uuid}
        at: {type: string, format: date-time}
        simulationActorId: {type: string, format: uuid}
        productActorId: {type: string, format: uuid}
        role: {enum: [FARMER, BUYER, TRANSPORTER, COORDINATOR]}
        toolName: {type: string, minLength: 1}
        status: {enum: [SUCCEEDED, REJECTED]}
        summary: {type: string, minLength: 1}
        traceId: {type: string, format: uuid}
        entityId: {type: string, format: uuid}
        eventIds: {type: array, items: {type: string, format: uuid}}
        adapter: {type: string, minLength: 1}
        approval: {enum: [NONE, SYNTHETIC_PARTICIPANT]}
        correlationId: {type: string, format: uuid}
        causationId: {type: string, format: uuid}
    SimulationOperationsSnapshot:
      type: object
      additionalProperties: false
      required: [activeListings, openDemands, ordersByStatus, orderOutcomes, deliveryAcceptedKg, approvedCommitmentCount, completedMissionCount, activeMissionIds, openExceptionIds]
      properties:
        activeListings: {type: integer, minimum: 0}
        openDemands: {type: integer, minimum: 0}
        ordersByStatus: {type: object, additionalProperties: {type: integer, minimum: 0}}
        orderOutcomes: {$ref: '#/components/schemas/OrderOutcomeSummary'}
        deliveryAcceptedKg: {type: number, minimum: 0}
        approvedCommitmentCount: {type: integer, minimum: 0}
        completedMissionCount: {type: integer, minimum: 0}
        activeMissionIds: {type: array, items: {type: string, format: uuid}}
        openExceptionIds: {type: array, items: {type: string, format: uuid}}
    ReferencePlace:
      type: object
      additionalProperties: false
      required: [referencePlaceId, islandId, name, category, position, sourceId, sourceFeatureId, sourceUrl, sourceRevision, retrievedAt, evidenceType, warnings]
      properties:
        referencePlaceId: {type: string, minLength: 1}
        islandId: {type: string, minLength: 1}
        name: {type: string, minLength: 1}
        category: {enum: [AGRICULTURAL_AREA, HOTEL_RESORT, RESTAURANT, SUPERMARKET_MARKET, PORT_FERRY_TERMINAL]}
        position: {$ref: './common.schema.json#/$defs/GeoPoint'}
        sourceId: {type: string, minLength: 1}
        sourceFeatureId: {type: string, minLength: 1}
        sourceUrl: {type: string, format: uri}
        sourceRevision: {type: string, minLength: 1}
        retrievedAt: {type: string, format: date}
        evidenceType: {enum: [PUBLIC_REFERENCE_POINT, PUBLIC_FEATURE_CENTROID, APPROXIMATE_PUBLIC_AREA_CENTROID]}
        warnings: {type: array, items: {type: string, minLength: 1}}
    ReferenceDataSource:
      type: object
      additionalProperties: false
      required: [sourceId, title, publisher, sourceUrl, licenceName, licenceUrl, attribution, retrievedAt, revision, limitations]
      properties:
        sourceId: {type: string, minLength: 1}
        title: {type: string, minLength: 1}
        publisher: {type: string, minLength: 1}
        sourceUrl: {type: string, format: uri}
        licenceName: {type: string, minLength: 1}
        licenceUrl: {type: string, format: uri}
        attribution: {type: string, minLength: 1}
        retrievedAt: {type: string, format: date}
        revision: {type: string, minLength: 1}
        limitations: {type: array, items: {type: string, minLength: 1}}
    ReplayScene:
      type: object
      additionalProperties: false
      required: [runId, scenarioId, policy, seed, startsAt, endsAt, farms, buyers, transporters, roads, referencePlaces, referenceDataSources, participants, evidenceLabel]
      properties:
        runId: {type: string, format: uuid}
        scenarioId: {type: string}
        policy: {enum: [BASELINE, HARVEST]}
        seed: {type: integer, minimum: 0, maximum: 4294967295}
        startsAt: {type: string, format: date-time}
        endsAt: {type: string, format: date-time}
        farms:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [farmId, islandId, name, position]
            properties:
              farmId: {type: string, format: uuid}
              islandId: {type: string, minLength: 1}
              name: {type: string}
              position: {$ref: './common.schema.json#/$defs/GeoPoint'}
              referencePlaceId: {type: string, minLength: 1}
        buyers:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [buyerId, islandId, name, position]
            properties:
              buyerId: {type: string, format: uuid}
              islandId: {type: string, minLength: 1}
              name: {type: string}
              position: {$ref: './common.schema.json#/$defs/GeoPoint'}
              referencePlaceId: {type: string, minLength: 1}
        transporters:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [transporterId, islandId, name, homePosition, capacityKg]
            properties:
              transporterId: {type: string, format: uuid}
              islandId: {type: string, minLength: 1}
              name: {type: string}
              homePosition: {$ref: './common.schema.json#/$defs/GeoPoint'}
              capacityKg: {type: number, minimum: 0}
              referencePlaceId: {type: string, minLength: 1}
        roads:
          type: array
          items:
            type: object
            additionalProperties: false
            required: [roadSegmentId, islandId, name, from, to, distanceKm]
            properties:
              roadSegmentId: {type: string, format: uuid}
              islandId: {type: string, minLength: 1}
              name: {type: string}
              from: {$ref: './common.schema.json#/$defs/GeoPoint'}
              to: {$ref: './common.schema.json#/$defs/GeoPoint'}
              distanceKm: {type: number, minimum: 0}
        referencePlaces: {type: array, items: {$ref: '#/components/schemas/ReferencePlace'}}
        referenceDataSources: {type: array, items: {$ref: '#/components/schemas/ReferenceDataSource'}}
        participants: {type: array, items: {$ref: '#/components/schemas/SimulationParticipant'}}
        evidenceLabel: {type: string}
    ReplayFrame:
      type: object
      additionalProperties: false
      required: [atMs, at, eventType, actors, missions, batches, demands, disruptions, degradedRoadSegmentIds, newDecisions, totals]
      properties:
        atMs: {type: integer}
        at: {type: string, format: date-time}
        eventType: {type: string}
        actors: {type: array, items: {$ref: '#/components/schemas/ObservableActor'}}
        missions: {type: array, items: {type: object, additionalProperties: true}}
        batches: {type: array, items: {type: object, additionalProperties: true}}
        demands: {type: array, items: {type: object, additionalProperties: true}}
        disruptions: {type: array, items: {$ref: '#/components/schemas/ObservableDisruption'}}
        degradedRoadSegmentIds: {type: array, items: {type: string, format: uuid}}
        newDecisions: {type: array, items: {$ref: '#/components/schemas/ReplayDecision'}}
        agentActions: {type: array, items: {$ref: '#/components/schemas/SimulationAgentAction'}}
        operationsSnapshot: {$ref: '#/components/schemas/SimulationOperationsSnapshot'}
        totals: {type: object, additionalProperties: {type: number}}
    SimulationParticipantSessionCreate:
      type: object
      additionalProperties: false
      required: [productActorId]
      properties:
        productActorId: {type: string, format: uuid}
    SimulationParticipantSession:
      type: object
      additionalProperties: false
      required: [accessToken, expiresInSeconds, participant]
      properties:
        accessToken: {type: string, minLength: 1}
        expiresInSeconds: {type: integer, const: 900}
        participant:
          type: object
          additionalProperties: false
          required: [simulationActorId, productActorId, name, role, simulationRunId, readOnly]
          properties:
            simulationActorId: {type: string, format: uuid}
            productActorId: {type: string, format: uuid}
            name: {type: string}
            role: {enum: [FARMER, BUYER, TRANSPORTER, COORDINATOR]}
            simulationRunId: {type: string, format: uuid}
            readOnly: {const: true}
    SimulationTimeline:
      type: object
      additionalProperties: false
      required: [runId, evidenceLabel, provenanceNote, scene, frames]
      properties:
        runId: {type: string, format: uuid}
        evidenceLabel: {type: string}
        provenanceNote: {type: string}
        scene: {$ref: '#/components/schemas/ReplayScene'}
        frames: {type: array, items: {$ref: '#/components/schemas/ReplayFrame'}}
    SimulationWorldFrame:
      type: object
      additionalProperties: false
      required: [runId, frameIndex, frameCount, frame]
      properties:
        runId: {type: string, format: uuid}
        frameIndex: {type: integer, minimum: 0}
        frameCount: {type: integer, minimum: 1}
        frame: {$ref: '#/components/schemas/ReplayFrame'}
    PairedRunCreate:
      type: object
      additionalProperties: false
      required: [scenarioId, seed, decisionMode, scope]
      properties:
        scenarioId: {type: string, minLength: 1}
        seed: {type: integer, minimum: 0, maximum: 4294967295}
        decisionMode: {enum: [DETERMINISTIC, LLM_ASSISTED]}
        scope: {$ref: '#/components/schemas/SimulationScope'}
        disruptions: {type: array, items: {$ref: '#/components/schemas/InjectedDisruption'}}
    BenchmarkMetrics:
      type: object
      additionalProperties: false
      required: [localProcurementRate, fulfilmentRate, wasteQuantity]
      properties:
        localProcurementRate: {type: number, minimum: 0, maximum: 1}
        fulfilmentRate: {type: number, minimum: 0, maximum: 1}
        wasteQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
    BenchmarkComparison:
      type: object
      additionalProperties: false
      required: [baseline, harvest, delta]
      properties:
        baseline: {$ref: '#/components/schemas/BenchmarkMetrics'}
        harvest: {$ref: '#/components/schemas/BenchmarkMetrics'}
        delta:
          type: object
          additionalProperties: false
