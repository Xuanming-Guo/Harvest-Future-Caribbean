      properties:
        deliveryId: {type: string, format: uuid}
        orderId: {type: string, format: uuid}
        outcome: {enum: [ACCEPTED, PARTIALLY_ACCEPTED, REJECTED]}
        acceptedQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
        rejectedQuantity: {$ref: './common.schema.json#/$defs/Quantity'}
        note: {type: string, maxLength: 1000}
        acceptedBy: {type: string, format: uuid}
        acceptedAt: {type: string, format: date-time}
    OperationsSnapshot:
      type: object
      additionalProperties: false
      required: [generatedAt, activeListings, openDemands, ordersByStatus, activeMissionIds, openExceptionIds]
      properties:
        generatedAt: {type: string, format: date-time}
        simulationRunId: {type: string, format: uuid}
        activeListings: {type: integer, minimum: 0}
        openDemands: {type: integer, minimum: 0}
        ordersByStatus: {type: object, additionalProperties: {type: integer, minimum: 0}}
        activeMissionIds: {type: array, items: {type: string, format: uuid}}
        openExceptionIds: {type: array, items: {type: string, format: uuid}}
    TraceStep:
      type: object
      additionalProperties: false
      required: [recordedAt, kind, summary]
      properties:
        recordedAt: {type: string, format: date-time}
        kind: {enum: [INPUT, EVIDENCE, TOOL_CALL, DECISION, APPROVAL, STATE_CHANGE, OUTCOME]}
        summary: {type: string, minLength: 1, maxLength: 1000}
        confidence: {type: number, minimum: 0, maximum: 1}
    AgentTrace:
      type: object
      additionalProperties: false
      required: [traceId, subjectType, subjectId, status, summary, steps]
      properties:
        traceId: {type: string, format: uuid}
        subjectType: {enum: [CROP_BATCH, ORDER, DELIVERY, EXCEPTION]}
        subjectId: {type: string, format: uuid}
        status: {enum: [RUNNING, AWAITING_APPROVAL, COMPLETED, FAILED]}
        summary: {type: string, minLength: 1, maxLength: 2000}
        steps: {type: array, items: {$ref: '#/components/schemas/TraceStep'}}
    SimulationRunCreate:
      type: object
      additionalProperties: false
      required: [scenarioId, policy, seed, speed]
      properties:
        scenarioId: {type: string, minLength: 1}
        policy: {enum: [BASELINE, HARVEST]}
        seed: {type: integer, minimum: 0, maximum: 4294967295}
        speed: {type: number, exclusiveMinimum: 0, maximum: 1000}
    SimulationRun:
      type: object
      additionalProperties: false
      required: [runId, scenarioId, policy, seed, speed, status, currentTime, createdAt]
      properties:
        runId: {type: string, format: uuid}
        scenarioId: {type: string, minLength: 1}
        policy: {enum: [BASELINE, HARVEST]}
        seed: {type: integer, minimum: 0, maximum: 4294967295}
        speed: {type: number, exclusiveMinimum: 0, maximum: 1000}
        status: {enum: [READY, RUNNING, PAUSED, COMPLETED, FAILED]}
        currentTime: {type: string, format: date-time}
        createdAt: {type: string, format: date-time}
    SimulationCommand:
      oneOf:
        - type: object
          additionalProperties: false
          required: [command]
          properties: {command: {enum: [START, PAUSE, RESUME, RESET]}}
        - type: object
          additionalProperties: false
          required: [command, speed]
          properties:
            command: {const: SPEED}
            speed: {type: number, exclusiveMinimum: 0, maximum: 1000}
        - type: object
          additionalProperties: false
          required: [command, targetTime]
          properties:
            command: {const: REWIND}
            targetTime: {type: string, format: date-time}
        - type: object
          additionalProperties: false
          required: [command, injection]
          properties:
            command: {const: INJECT}
            injection:
              type: object
              additionalProperties: false
              required: [type, scheduledFor, affectedEntityIds]
              properties:
                type: {enum: [WEATHER, ROAD, VEHICLE, CROP, DEMAND]}
                scheduledFor: {type: string, format: date-time}
                affectedEntityIds: {type: array, minItems: 1, items: {type: string, format: uuid}}
                publicDescription: {type: string, maxLength: 500}
