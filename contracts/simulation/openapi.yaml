openapi: 3.1.0
info:
  title: Harvest Simulation Service API
  version: 0.1.0
  description: >-
    Internal FastAPI interface called by the Product API simulation gateway.
    The simulation owns time, seed, policy, schedules, disruptions, and hidden
    truth. Responses expose only observable state. Harvest actors call the
    Product API rather than this service for operational work.
servers:
  - url: http://localhost:8001
security:
  - internalServiceToken: []
paths:
  /internal/v1/runs:
    post:
      operationId: createRun
      summary: Create deterministic scenario state
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../openapi.yaml#/components/schemas/SimulationRunCreate'}
            example: {scenarioId: saint-lucia-demo-v1, policy: HARVEST, seed: 8675309, speed: 10}
      responses:
        '201':
          description: Run ready.
          content:
            application/json:
              schema: {$ref: '../openapi.yaml#/components/schemas/SimulationRun'}
              example:
                runId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                scenarioId: saint-lucia-demo-v1
                policy: HARVEST
                seed: 8675309
                speed: 10
                status: READY
                currentTime: '2026-09-01T06:00:00Z'
                createdAt: '2026-08-01T12:00:00Z'
        default: {$ref: '#/components/responses/Problem'}
  /internal/v1/runs/{runId}:
    get:
      operationId: getRun
      summary: Read simulation status and clock
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Observable run state.
          content:
            application/json:
              schema: {$ref: '../openapi.yaml#/components/schemas/SimulationRun'}
              example:
                runId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                scenarioId: saint-lucia-demo-v1
                policy: HARVEST
                seed: 8675309
                speed: 10
                status: RUNNING
                currentTime: '2026-09-04T14:15:00Z'
                createdAt: '2026-08-01T12:00:00Z'
        default: {$ref: '#/components/responses/Problem'}
  /internal/v1/runs/{runId}/commands:
    post:
      operationId: commandRun
      summary: Apply a validated run command deterministically
      parameters:
        - $ref: '#/components/parameters/RunId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../openapi.yaml#/components/schemas/SimulationCommand'}
            example: {command: SPEED, speed: 20}
      responses:
        '202':
          description: Command accepted.
          content:
            application/json:
              schema: {$ref: '../openapi.yaml#/components/schemas/SimulationCommandReceipt'}
              example:
                commandId: 29292929-2929-4929-8929-292929292929
                runId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                command: SPEED
                status: ACCEPTED
                acceptedAt: '2026-08-01T12:05:00Z'
        default: {$ref: '#/components/responses/Problem'}
  /internal/v1/runs/{runId}/world:
    get:
      operationId: getObservableWorld
      summary: Read the allow-listed observable world projection
      parameters:
        - $ref: '#/components/parameters/RunId'
      responses:
        '200':
          description: Observable world without hidden biological truth or future disruptions.
          content:
            application/json:
              schema: {$ref: '../openapi.yaml#/components/schemas/ObservableWorld'}
              example:
                runId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                simulationTime: '2026-09-04T14:15:00Z'
                actors:
                  - actorId: 24242424-2424-4424-8424-242424242424
                    role: TRANSPORTER
                    position: {latitude: 13.925, longitude: -60.97}
                    activity: DELIVERING
                routes:
                  - missionId: 23232323-2323-4323-8323-232323232323
                    status: ACTIVE
                    path: [{latitude: 13.94, longitude: -60.96}, {latitude: 13.9094, longitude: -60.9789}]
                disruptions: []
        default: {$ref: '#/components/responses/Problem'}
  /internal/v1/paired-runs:
    post:
      operationId: createPairedRun
      summary: Create baseline and Harvest runs from the same initial state
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '../openapi.yaml#/components/schemas/PairedRunCreate'}
            example: {scenarioId: saint-lucia-demo-v1, seed: 8675309}
      responses:
        '201':
          description: Pair ready.
          content:
            application/json:
              schema: {$ref: '../openapi.yaml#/components/schemas/PairedRun'}
              example:
                pairId: 30303030-3030-4030-8030-303030303030
                scenarioId: saint-lucia-demo-v1
                seed: 8675309
                baselineRunId: 31313131-3131-4131-8131-313131313131
                harvestRunId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                status: READY
        default: {$ref: '#/components/responses/Problem'}
  /internal/v1/paired-runs/{pairId}:
    get:
      operationId: getPairedRun
      summary: Read pair status and aggregate metrics
      parameters:
        - $ref: '#/components/parameters/PairId'
      responses:
        '200':
          description: Pair status; completed results are posted back to the Product API.
          content:
            application/json:
              schema: {$ref: '../openapi.yaml#/components/schemas/PairedRun'}
              example:
                pairId: 30303030-3030-4030-8030-303030303030
                scenarioId: saint-lucia-demo-v1
                seed: 8675309
                baselineRunId: 31313131-3131-4131-8131-313131313131
                harvestRunId: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb
                status: COMPLETED
                result:
                  baseline: {localProcurementRate: 0.44, fulfilmentRate: 0.68, wasteQuantity: {value: 170, unit: kg}}
                  harvest: {localProcurementRate: 0.7, fulfilmentRate: 0.91, wasteQuantity: {value: 80, unit: kg}}
        default: {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    internalServiceToken:
      type: http
      scheme: bearer
      bearerFormat: opaque-service-token
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 8, maxLength: 128, pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]+$'}
    RunId:
      name: runId
      in: path
      required: true
      schema: {type: string, format: uuid}
    PairId:
      name: pairId
      in: path
      required: true
      schema: {type: string, format: uuid}
  responses:
    Problem:
      description: RFC 7807 validation, authentication, state, or idempotency error.
      content:
        application/problem+json:
          schema: {$ref: '../common.schema.json#/$defs/Problem'}
          example: {type: /problems/state-conflict, title: Command is invalid for run state, status: 409, code: INVALID_RUN_STATE}
