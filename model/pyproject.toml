[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "harvest-yield-model"
version = "0.1.0"
description = "Explainable quantile harvest-estimation service for Harvest"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "scikit-learn>=1.5,<2",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.27,<1", "pytest>=8,<9"]

[project.scripts]
harvest-model = "harvest_model.service:run"
harvest-model-evaluate = "harvest_model.evaluation:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
where = ["src"]
